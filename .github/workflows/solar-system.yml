name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
    MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}
    
jobs:
      unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        container: 
          image: 'node:20'
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        #- name: setup NodeJs Version
        # uses: actions/setup-node@v4
         # with:
          #  node-version: 20

        - name: cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node-modules ${{ hashFiles('package-lock.json') }}

        - name: Install dependencies
          run: npm install

        - name: unit testing 
          id: npm-unit-testing-step
          run: npm test

        - name: Archive Test Result 
          if:  always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-result-${{matrix.os}}-node${{matrix.nodejs_version}}
            path: test-results.xml

      code-coverage:
        name: code Coverage
        runs-on: ubuntu-latest

        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: setup NodeJs Version
          uses: actions/setup-node@v4
          with:
            node-version: 18

        - name: cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}


        - name: Install dependencies
          run: npm install

        - name: check code Coverage
          continue-on-error: true
          run: npm run coverage

        - name: Archive Test Result 
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-result
            path: coverage
            retention-days: 5
  
      docker:
       permissions:      #added
        packages: write  #added
       runs-on: ubuntu-latest
       needs:
       - code-coverage
       - unit-testing
       steps:
       - uses: actions/checkout@v4

       - name: set lowercase owner
         run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

       - name: Docker Hub Login
         uses: docker/login-action@v3
         with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

       - name: GHCR login
         uses: docker/login-action@v3
         with:
          registry: ghcr.io
          username: '${{ github.repository_owner }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
         
       - name: Container Registry Push
         uses: docker/build-push-action@v6
         with:
          context: .
          push: true
          tags: |
            docker.io/${{vars.DOCKER_USERNAME}}/solar-system:${{ github.sha }}
            ghcr.io/${{env.OWNER}}/solar-system:${{ github.sha }}
      
      dev-deploy:
        needs: docker
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repo
            uses: actions/checkout@v4
          
          - name: Installing Kubectl 
            uses: azure/setup-kubectl@v4
            with:
              version: "v1.26.0"
          
          - name: Set Kubeconfig File
            uses: azure/k8s-set-context@v4
            with:
              method: kubeconfig
              kubeconfig: ${{secrets.KUBECONFIG}}
            
          - name: fetch kubernetes Cluster Details
            run: kubectl version
              echo --------------------------
              kubectl get nodes
          
          - name: Save Nginx Ingress Controller IP as a GITHUB environment Variable
            run: |
              echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath="{.status.loadbalancer.ingress[0].ip}")" >> $GITHUB_ENV
          
          - name: Replace Token in Manifest File
            uses: cschleiden/replace-tokens@v1
            with: 
              tokenPrefix: '_{_'
              tokenSuffix: '_}_'
              files: '["kubernetes/development/*.yaml"]'
            env: 
              NAMESPACE: ${{vars.NAMESPACE}}
              REPLICAS: ${{vars.REPLICAS}}
              IMAGE: ${{vars.DOCKER_USERNAME}}/solar-system:${{ github.sha }}
              INGRESS_IP: ${{env.INGRESS_IP}}

          - name: check files
            run: |
              cat kubernetes/development/*.yaml

          - name: Deploy to Dev Env
            run: |
              kubectl apply -f kuben=rnetes/develpoment/*.yaml

              







